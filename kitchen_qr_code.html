<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-код для отметки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 3px solid #667eea;
            display: inline-block;
            margin-bottom: 20px;
        }

        #qrcode {
            display: inline-block;
        }

        .code-text {
            background: #f5f5f5;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 30px;
        }

        .instructions {
            text-align: left;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .instructions h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .step {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }

        .step-number {
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .step-text {
            color: #555;
            font-size: 14px;
        }

        .icon {
            font-size: 24px;
            margin-right: 10px;
        }

        @media print {
            body {
                background: white;
            }
            .container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 ОТМЕТКА ПРИХОДА И УХОДА</h1>
        <p class="subtitle">Сканируйте QR-код при приходе и уходе</p>

        <div class="qr-container">
            <div id="qrcode"></div>
        </div>

        <div class="code-text">KITCHEN_CHECKIN</div>

        <div class="instructions">
            <h3>📋 Инструкция:</h3>
            
            <div class="step">
                <div class="step-number">1</div>
                <div class="step-text">Откройте приложение на телефоне</div>
            </div>

            <div class="step">
                <div class="step-number">2</div>
                <div class="step-text">Нажмите "Сканировать QR"</div>
            </div>

            <div class="step">
                <div class="step-number">3</div>
                <div class="step-text">Наведите камеру на этот QR-код</div>
            </div>

            <div class="step">
                <div class="step-number">4</div>
                <div class="step-text">При приходе - первое сканирование ✅</div>
            </div>

            <div class="step">
                <div class="step-number">5</div>
                <div class="step-text">При уходе - второе сканирование 🏁</div>
            </div>
        </div>
    </div>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        // Generate QR Code
        new QRCode(document.getElementById("qrcode"), {
            text: "KITCHEN_CHECKIN",
            width: 300,
            height: 300,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
